<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C4F"/>
      <stop offset="0.45" stop-color="#B24A22"/>
      <stop offset="0.75" stop-color="#F2661F"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE3B0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1420" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D1420" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" fill="url(#sky)"/>
  <circle cx="620" cy="230" r="230" fill="url(#sun)"/>

  <!-- تلال بعيدة -->
  <path d="M0 430 Q150 400 300 425 T600 415 T900 430 V620 H0 Z" fill="#0D1420" opacity="0.35"/>

  <!-- أبراج المصفاة -->
  <g fill="#0D1420">
    <rect x="560" y="230" width="14" height="200"/>
    <rect x="590" y="180" width="20" height="250"/>
    <polygon points="590,180 600,150 610,180"/>
    <rect x="630" y="260" width="12" height="170"/>
    <rect x="660" y="210" width="16" height="220"/>
    <rect x="700" y="270" width="10" height="160"/>
    <rect x="725" y="240" width="14" height="190"/>
    <rect x="760" y="290" width="10" height="140"/>
    <rect x="785" y="255" width="16" height="175"/>
    <rect x="820" y="300" width="10" height="130"/>
    <!-- خطوط أنابيب أفقية -->
    <rect x="560" y="330" width="280" height="6"/>
    <rect x="600" y="370" width="230" height="5"/>
  </g>

  <!-- شعلة الغاز -->
  <circle cx="600" cy="145" r="7" fill="#FFB347"/>
  <circle cx="600" cy="145" r="14" fill="#FFB347" opacity="0.35"/>

  <!-- منصة الضخ (نودينغ دونكي) -->
  <g fill="#0D1420">
    <rect x="230" y="400" width="140" height="8"/>
    <rect x="240" y="330" width="10" height="80"/>
    <rect x="340" y="330" width="10" height="80"/>
    <path d="M245 330 L280 250 L315 330 Z" opacity="0.95"/>
    <rect x="270" y="248" width="120" height="10" transform="rotate(-8 270 248)"/>
    <circle cx="278" cy="255" r="9"/>
    <rect x="180" y="290" width="16" height="60"/>
    <path d="M170 350 h60 v22 h-60 z"/>
  </g>

  <!-- الأرضية الداكنة -->
  <rect x="0" y="430" width="900" height="190" fill="url(#ground)"/>

  <!-- شبكة النقاط المضيئة -->
  <g stroke="#FFB347" stroke-width="1" opacity="0.55">
    <line x1="120" y1="520" x2="260" y2="470"/>
    <line x1="260" y1="470" x2="410" y2="500"/>
    <line x1="410" y1="500" x2="330" y2="560"/>
    <line x1="330" y1="560" x2="120" y2="520"/>
    <line x1="410" y1="500" x2="560" y2="470"/>
    <line x1="560" y1="470" x2="700" y2="510"/>
    <line x1="700" y1="510" x2="620" y2="570"/>
    <line x1="620" y1="570" x2="450" y2="555"/>
    <line x1="700" y1="510" x2="830" y2="480"/>
    <line x1="830" y1="480" x2="880" y2="540"/>
  </g>
  <g fill="#FFB347">
    <circle cx="120" cy="520" r="4"/>
    <circle cx="260" cy="470" r="3"/>
    <circle cx="410" cy="500" r="5"/>
    <circle cx="330" cy="560" r="3"/>
    <circle cx="560" cy="470" r="4"/>
    <circle cx="700" cy="510" r="5"/>
    <circle cx="620" cy="570" r="3"/>
    <circle cx="450" cy="555" r="3"/>
    <circle cx="830" cy="480" r="4"/>
    <circle cx="880" cy="540" r="3"/>
  </g>
</svg>
